---
version: '3'

dotenv: ['.env']

vars:
  ROOT_DIR:
    sh: git rev-parse --show-toplevel
  PORT: 8000

tasks:
  serve:
    desc: Serve a local zensical server
    cmds:
      - zensical serve
  lc:
    desc: Check for dead links using lychee
    cmds:
      - lychee docs/
  lc:offline:
    desc: Check for dead local links and images using lychee (offline)
    cmds:
      - lychee --offline docs/
  lc:file:
    desc: Link check a given file using lychee
    cmds:
      - lychee {{shellQuote .FILE}}
  mdl:
    desc: Run markdownlint-cli
    cmds:
      - rumdl check .
  mdl:fix:
    desc: Run markdownlint-cli fix
    cmds:
      - rumdl check --fix .
  sort:
    desc: Sort dictionary.txt
    cmds:
      - sort {{ .ROOT_DIR }}/dictionary.txt -u -o {{ .ROOT_DIR }}/dictionary.txt
  spellcheck:
    desc: Spellcheck cook files
    cmds:
      - python3 scripts/generate_typos_config.py
      - typos
  sc:file:
    desc: Spellcheck a single file
    cmds:
      - python3 scripts/generate_typos_config.py
      - typos {{shellQuote .FILE}}
  default:
    cmds:
      - task -a
    silent: true

  yl:
    desc: Run yamllint
    cmds:
      - yamllint-rs .
      
  tools:install:
    desc: Install required tools
    cmds:
      - uv tool install zensical

  tools:update:
    desc: Upgrade Zensical (re-installation required, --from flag unsupported)
    cmds:
      - uv tool upgrade zensical

  build:
    desc: Build the static site
    cmds:
      - zensical build

  encrypt:
    desc: Encrypt secrets file using SOPS
    preconditions:
      - test -f .env
    cmds:
      - 'sops -e --input-type dotenv --output-type dotenv .env > .env.enc'

  decrypt:
    desc: Decrypt secrets file using SOPS
    preconditions:
      - test -f .env.enc
    cmds:
       - 'sops -d --input-type dotenv --output-type dotenv .env.enc > .env'

  new-plant:
    desc: "Generate a new plant profile template. Usage: task new-plant -- poblano-pepper"
    vars:
      FILE: '{{.CLI_ARGS}}'
      DATE:
        sh: date +%Y-%m-%d
    cmds:
      - 'test -n "{{.FILE}}" || (echo "Error: Provide a filename (e.g., task new-plant -- tomato)" && exit 1)'
      - mkdir -p docs/plants
      - |
        cat << 'EOF' > docs/plants/{{.FILE}}.md
        ---
        title: {{.FILE}}
        tags: []
        location: 
        planted: {{.DATE}}
        ---

        # {{.FILE}}

        **Type:** **Variety:** ## Cultivation Status

        | Attribute | Details |
        | :--- | :--- |
        | **Current State** | Active Growth |
        | **Date Planted** | {{.DATE}} |
        | **Season Planted** | |
        | **Location** | |

        ## Log & Observations

        * **{{.DATE}}:** Initial logging.

        ## Notes
        * EOF
      - echo "Created docs/plants/{{.FILE}}.md"
  
  new-bed:
    desc: "Generate a new raised bed template. Usage: task new-bed -- raised-bed-4"
    vars:
      FILE: '{{.CLI_ARGS}}'
      DATE:
        sh: date +%Y-%m-%d
    cmds:
      - 'test -n "{{.FILE}}" || (echo "Error: Provide a filename (e.g., task new-bed -- raised-bed-4)" && exit 1)'
      - mkdir -p docs/beds
      - |
        cat << 'EOF' > docs/beds/{{.FILE}}.md
        # {{.FILE}}

        **Dimensions:** **Material:** **Irrigation:** ## Soil Management
        * **{{.DATE}}:** Initial setup.

        ## Crop History
        | Year | Season | Crop | Notes |
        | :--- | :--- | :--- | :--- |
        | | | | |
        EOF
      - echo "Created docs/beds/{{.FILE}}.md"
