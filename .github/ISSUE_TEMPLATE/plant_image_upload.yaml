name: 🌿 Plant Image Upload
description: Submit a plant image for the Antigravity CLI to analyze or process.
title: "[Plant]: "
labels: ["plant-analysis", "image-processing"]
body:
  - type: markdown
    attributes:
      value: |
        ### Welcome! 
        Thanks for submitting a plant image. Please fill out the fields below so the Antigravity CLI agent can parse and process your image cleanly.
  
  - type: input
    id: plant_name
    attributes:
      label: 🌵 Plant Name / Guess
      description: What is the name of the plant? (Leave a guess or "Unknown" if you want the agent to identify it).
      placeholder: e.g., Monstera Deliciosa, Snake Plant, Unknown
    validations:
      required: true

  - type: textarea
    id: plant_image
    attributes:
      label: 📷 Plant Image
      description: Drag and drop your image (or paste Google Photos links) directly into this box.
      placeholder: Drop your plant image here...
    validations:
      required: true

  - type: input
    id: location_source
    attributes:
      label: 📍 Location or Source URL (Optional)
      description: Where was this photo taken, or what is the Google Photos source link? (Helps with native plant identification).
      placeholder: e.g., Southern California, or https://photos.google.com/...
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 📝 Symptoms / Notes / Instructions
      description: Add any extra context or specific tasks for the AI agent (e.g., "Is this overwatered?", "Identify this pest").
      placeholder: e.g., "Yellowing leaves on the bottom," or "Tell me how often to water this."
    validations:
      required: false
    
